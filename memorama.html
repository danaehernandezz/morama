<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Memorama Interactivo</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #f4f7f6;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
        }

        h1 {
            color: #2c3e50;
            margin-bottom: 10px;
        }

        .stats {
            display: flex;
            gap: 20px;
            margin-bottom: 20px;
            font-size: 1.1rem;
            color: #34495e;
            font-weight: 600;
        }

        .game-board {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 15px;
            max-width: 850px;
            width: 100%;
            perspective: 1000px;
        }

        .card {
            background-color: transparent;
            height: 150px;
            border-radius: 10px;
            cursor: pointer;
            perspective: 1000px;
        }

        .card-inner {
            position: relative;
            width: 100%;
            height: 100%;
            text-align: center;
            transition: transform 0.6s;
            transform-style: preserve-3d;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            border-radius: 10px;
        }

        .card.flipped .card-inner {
            transform: rotateY(180deg);
        }

        .card.matched .card-inner {
            transform: rotateY(180deg);
            box-shadow: 0 0 12px #2ecc71;
        }

        .card-front, .card-back {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 8px;
            overflow: hidden;
        }

        .card-front {
            background: linear-gradient(135deg, #3498db, #2980b9);
            color: white;
            font-size: 2.2rem;
            font-weight: bold;
        }

        .card-back {
            background-color: #ffffff;
            color: #2c3e50;
            transform: rotateY(180deg);
            border: 2px solid #3498db;
            font-size: 0.95rem;
            font-weight: 600;
            line-height: 1.3;
            text-align: center;
            flex-direction: column;
        }

        .card-back img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
            border-radius: 4px;
        }

        button.reset-btn {
            margin-top: 25px;
            padding: 12px 30px;
            background-color: #2ecc71;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.3s;
        }

        button.reset-btn:hover {
            background-color: #27ae60;
        }

        @media (max-width: 650px) {
            .game-board {
                grid-template-columns: repeat(3, 1fr);
                gap: 10px;
            }
            .card {
                height: 120px;
            }
            .card-back {
                font-size: 0.8rem;
            }
        }
    </style>
</head>
<body>

    <h1>Memorama Interactivo</h1>
    <div class="stats">
        <div>Intentos: <span id="moves">0</span></div>
        <div>Parejas encontradas: <span id="matches">0</span> / 8</div>
    </div>

    <div class="game-board" id="board"></div>

    <button class="reset-btn" onclick="initGame()">Reiniciar Juego</button>

    <script>
        // Si tienes imágenes locales en el mismo servidor, usa rutas relativas.
        // Si el archivo HTML está en la misma carpeta que las imágenes, esta configuración cargará correctamente:
        const cardData = [
            { id: 1, type: 'img', src: 'ninapizza.png', fallbackText: '🍕 Susana comiendo pizza' },
            { id: 1, type: 'text', content: "Susana's pizza is delicious and crispy" },
            { id: 2, type: 'img', src: 'caballo.png', fallbackText: '🐴 Tomas en su caballo' },
            { id: 2, type: 'text', content: "Tomas's horse is very friendly" },
            { id: 3, type: 'img', src: 'cocina.png', fallbackText: '🥖 Horno de mamá' },
            { id: 3, type: 'text', content: "She is using mom's oven" },
            { id: 4, type: 'img', src: 'moto.png', fallbackText: '🏍️ Niña en moto' },
            { id: 4, type: 'text', content: "She is learning to ride her brother's..." },
            { id: 5, type: 'img', src: 'nina.png', fallbackText: '🎷 Romina con saxofón' },
            { id: 5, type: 'text', content: "Romina makes a lot of noise with her..." },
            { id: 6, type: 'img', src: 'compu.png', fallbackText: '💻 Niño en computadora' },
            { id: 6, type: 'text', content: "He is doing his homework on his computer" },
            { id: 7, type: 'img', src: 'baile.png', fallbackText: '💃🕺 Julian bailando' },
            { id: 7, type: 'text', content: "Julian is dancing with his wife at the..." },
            { id: 8, type: 'img', src: 'coche.png', fallbackText: '🚜 Niño en vehículo' },
            { id: 8, type: 'text', content: "He is goes to the supermarket" }
        ];

        let flippedCards = [];
        let matchedPairs = 0;
        let moves = 0;
        let lockBoard = false;

        function shuffle(array) {
            return array.sort(() => Math.random() - 0.5);
        }

        function initGame() {
            const board = document.getElementById('board');
            board.innerHTML = '';
            flippedCards = [];
            matchedPairs = 0;
            moves = 0;
            lockBoard = false;
            document.getElementById('moves').textContent = moves;
            document.getElementById('matches').textContent = matchedPairs;

            const shuffledCards = shuffle([...cardData]);

            shuffledCards.forEach((item) => {
                const card = document.createElement('div');
                card.classList.add('card');
                card.dataset.id = item.id;

                const cardInner = document.createElement('div');
                cardInner.classList.add('card-inner');

                const cardFront = document.createElement('div');
                cardFront.classList.add('card-front');
                cardFront.textContent = '?';

                const cardBack = document.createElement('div');
                cardBack.classList.add('card-back');

                if (item.type === 'img') {
                    const img = document.createElement('img');
                    img.src = item.src;
                    img.onerror = function() {
                        // Si no encuentra la imagen local, muestra texto descriptivo para que se pueda jugar
                        this.remove();
                        cardBack.textContent = item.fallbackText;
                    };
                    cardBack.appendChild(img);
                } else {
                    cardBack.textContent = item.content;
                }

                cardInner.appendChild(cardFront);
                cardInner.appendChild(cardBack);
                card.appendChild(cardInner);

                card.addEventListener('click', () => flipCard(card));
                board.appendChild(card);
            });
        }

        function flipCard(card) {
            if (lockBoard || card.classList.contains('flipped') || card.classList.contains('matched')) return;

            card.classList.add('flipped');
            flippedCards.push(card);

            if (flippedCards.length === 2) {
                checkMatch();
            }
        }

        function checkMatch() {
            lockBoard = true;
            moves++;
            document.getElementById('moves').textContent = moves;

            const [card1, card2] = flippedCards;
            const isMatch = card1.dataset.id === card2.dataset.id;

            if (isMatch) {
                card1.classList.add('matched');
                card2.classList.add('matched');
                matchedPairs++;
                document.getElementById('matches').textContent = matchedPairs;
                resetTurn();

                if (matchedPairs === 8) {
                    setTimeout(() => alert(`¡Felicidades! Completaste el memorama en ${moves} intentos.`), 500);
                }
            } else {
                setTimeout(() => {
                    card1.classList.remove('flipped');
                    card2.classList.remove('flipped');
                    resetTurn();
                }, 1200);
            }
        }

        function resetTurn() {
            flippedCards = [];
            lockBoard = false;
        }

        initGame();
    </script>
</body>
</html>
